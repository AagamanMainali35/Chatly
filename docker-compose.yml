services:
  db:
    image: postgres:15-alpine
    container_name: chat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: chat_web
    volumes:
      - .:/app
      - web_env:/app/.venv
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
  web_env: